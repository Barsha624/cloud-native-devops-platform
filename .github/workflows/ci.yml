name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    # Informational: a new advisory should not block unrelated work.
    # Remove continue-on-error to make this check strict.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t taskapi:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name taskapi -p 5000:5000 taskapi:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs taskapi
          exit 1
      - name: Scan image for vulnerabilities (report only)
        # --exit-code 0 reports findings without failing the build.
        # Change it to 1 once you are ready to enforce the scan.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 taskapi:ci
