# Small footprint for a local kind cluster. Install with:
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/values-kind.yaml
# The Grafana admin password is generated by the chart. Read it with:
#   kubectl get secret -n monitoring monitoring-grafana -o jsonpath="{.data.admin-password}"
# (decode the base64 value; do not commit it anywhere)
prometheus:
  prometheusSpec:
    # Discover ServiceMonitors/Rules in every namespace, not only ones labelled by this chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
alertmanager:
  enabled: false
grafana:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
